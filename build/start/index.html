<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Start your site | Station Sites</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F2ED">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400;75..125,500;75..125,800&family=Geist:wght@400;500;600&family=Big+Shoulders+Display:wght@800&family=Public+Sans:wght@400;600&family=Libre+Caslon+Text&family=Libre+Franklin:wght@400;600&family=Familjen+Grotesk:wght@600&family=Hanken+Grotesk:wght@400;600&family=Syne:wght@700&family=IBM+Plex+Sans:wght@400;600&family=Bodoni+Moda:ital,wght@0,500;1,500&family=Jost:wght@400;500&family=Host+Grotesk:wght@600&family=Newsreader:ital,wght@0,400;1,400&display=swap">
<link rel="icon" href="/favicon.ico">
<style>
:root{--paper:#F4F2ED;--ink:#16181D;--mute:#5E5A50;--soft:#8B8577;--rule:#DDD8CC;--pane:#FBFAF6;--blue:#2D6CDF;--blue-d:#2257BD;--blue-t:#E6EEFC;--night:#0B0D10;--display:Archivo,ui-sans-serif,sans-serif;--body:Geist,ui-sans-serif,system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#E9E6DE;color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* deck chrome (review only) */
.dk{display:flex;align-items:center;gap:14px;padding:12px max(16px,env(safe-area-inset-left));background:var(--night);color:#E8E6E1;font-size:13.5px;position:sticky;top:0;z-index:30}
.dk b{font-weight:600}
.dk .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#9AA0AA}
.dk .t b{color:#E8E6E1}
.dk button{min-height:36px;padding:0 12px;border-radius:999px;box-shadow:inset 0 0 0 1px #343943;color:#E8E6E1;font-size:13px;white-space:nowrap}
.dk button:hover{background:#1A1E25}
.dk .n{font-variant-numeric:tabular-nums;color:#9AA0AA;white-space:nowrap}
.idx{display:none;position:fixed;inset:60px 0 0;z-index:29;overflow:auto;background:rgba(11,13,16,.96);padding:24px 16px 60px}
.idx.on{display:block}
.idx-in{max-width:1100px;margin:0 auto}
.idx h2{color:#E8E6E1;font:800 26px/1.1 var(--display);font-variation-settings:"wdth" 108;letter-spacing:-.02em;margin:10px 0 6px}
.idx p{color:#9AA0AA;font-size:14px;margin-bottom:16px}
.idx ol{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 24px;counter-reset:i}
.idx li button{display:flex;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid #262B33;color:#D5D8DD;font-size:14.5px}
.idx li button span{color:#6B717B;font-variant-numeric:tabular-nums;min-width:2ch}
.idx li button:hover{color:#fff}
.idx .grp{grid-column:1/-1;color:#7D838D;font-size:12.5px;padding:18px 0 4px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;max-width:1500px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 40px}
.notes{align-self:start;position:sticky;top:76px;background:var(--pane);border-radius:10px;box-shadow:inset 0 0 0 1px var(--rule);padding:18px 18px 8px;font-size:14px;line-height:1.5}
.notes h3{font:800 18px/1.2 var(--display);font-variation-settings:"wdth" 105;letter-spacing:-.015em;margin-bottom:12px}
.notes dl{display:grid;gap:0}
.notes dt{font-size:12.5px;color:var(--soft);padding-top:12px;border-top:1px solid var(--rule)}
.notes dd{padding:2px 0 12px;color:var(--ink)}
.notes .tag{display:inline-block;margin:0 0 10px;padding:4px 9px;border-radius:999px;background:var(--blue-t);color:var(--blue-d);font-size:12px;font-weight:600}
body.clean .notes{display:none}
body.clean .stage{grid-template-columns:1fr}
@media (max-width:1100px){.stage{grid-template-columns:1fr}.notes{position:static}}

/* the app window */
.app{position:relative;background:var(--paper);border-radius:12px;box-shadow:0 0 0 1px #D3CEC2,0 30px 70px -40px rgba(22,24,29,.45);overflow:hidden;display:flex;flex-direction:column;min-height:min(820px,calc(100vh - 110px))}
.top{display:flex;align-items:center;gap:16px;height:60px;padding:0 20px;border-bottom:1px solid var(--rule);background:var(--paper)}
.logo{display:flex;align-items:center;gap:9px;font:700 13px/1 var(--body);letter-spacing:.14em;color:var(--ink);white-space:nowrap}
.logo svg{width:22px;height:22px;color:var(--blue)}
.logo span{color:var(--blue)}
.prog{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.prog .bar{flex:1;max-width:280px;height:4px;border-radius:4px;background:#E2DDD1;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:width .45s cubic-bezier(.3,.7,.2,1)}
.prog small{font-size:13px;color:var(--mute);white-space:nowrap}
.top a.call{font-size:13.5px;color:var(--mute);white-space:nowrap;text-decoration:underline;text-underline-offset:3px;text-decoration-color:#C9C3B5}
.top a.call:hover{color:var(--ink)}
.body{flex:1;display:grid;grid-template-columns:minmax(330px,.8fr) minmax(0,1.2fr);min-height:0}
.ask{padding:clamp(28px,4vw,52px) clamp(20px,3.4vw,48px) 24px;display:flex;flex-direction:column;min-width:0}
.ask .k{font-size:13.5px;color:var(--mute);margin-bottom:12px}
.ask h1{font:800 clamp(30px,3.2vw,44px)/1.02 var(--display);font-variation-settings:"wdth" 108;letter-spacing:-.03em}
.ask h1 em{font-style:normal;font-weight:400;font-variation-settings:"wdth" 92;color:var(--blue)}
.ask .lead{margin-top:12px;color:var(--mute);font-size:16px;max-width:42ch}
.ask .fields{margin-top:26px;display:grid;gap:12px}
.ask .help{margin-top:16px;font-size:13.5px;color:var(--mute)}
.ask .help a,.ask .help button{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:#C9C3B5}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:12px 16px;border-radius:10px;background:var(--pane);box-shadow:inset 0 0 0 1px var(--rule);text-align:left;transition:box-shadow .2s,background .2s}
.opt:hover{box-shadow:inset 0 0 0 1px #A9A292}
.opt[aria-pressed=true]{background:var(--blue-t);box-shadow:inset 0 0 0 2px var(--blue)}
.opt .ic{flex:none;width:36px;height:36px;border-radius:8px;background:#ECE8DF;display:grid;place-items:center;color:var(--ink)}
.opt[aria-pressed=true] .ic{background:#fff;color:var(--blue)}
.opt .ic svg{width:18px;height:18px}
.opt b{display:block;font-weight:600;font-size:15.5px;line-height:1.25}
.opt small{display:block;color:var(--mute);font-size:13px;line-height:1.35;margin-top:2px}
.opt .ck{margin-left:auto;flex:none;width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px #B8B1A1;display:grid;place-items:center;color:#fff}
.opt[aria-pressed=true] .ck{background:var(--blue);box-shadow:none}
.opt .ck svg{width:12px;height:12px;opacity:0}
.opt[aria-pressed=true] .ck svg{opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 16px;border-radius:999px;background:var(--pane);box-shadow:inset 0 0 0 1px var(--rule);font-size:14.5px;white-space:nowrap}
.chip:hover{box-shadow:inset 0 0 0 1px #A9A292}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);box-shadow:none}
label.f{display:grid;gap:6px;font-size:13.5px;color:var(--mute)}
label.f span b{color:var(--ink);font-weight:600}
.in{width:100%;min-height:50px;padding:12px 14px;border-radius:10px;border:0;background:#fff;box-shadow:inset 0 0 0 1px #CFC9BB;font-size:16px;color:var(--ink)}
.in:focus{outline:none;box-shadow:inset 0 0 0 2px var(--blue)}
textarea.in{min-height:84px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foot{display:flex;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid var(--rule);background:var(--paper)}
.meter{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;font-size:13.5px;color:var(--mute);white-space:nowrap;overflow:hidden}
.meter b{font:800 22px/1 var(--display);font-variation-settings:"wdth" 108;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.meter .pk{color:var(--ink);font-weight:600}
.meter .fr{color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15.5px;white-space:nowrap}
.btn.go{background:var(--blue);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 22px -12px rgba(45,108,223,.9)}
.btn.go:hover{background:#3C7BEA}
.btn.go[disabled]{background:#B9C9EA;box-shadow:none;cursor:not-allowed}
.btn.back{color:var(--mute);padding:0 14px}
.btn.back:hover{color:var(--ink)}
.btn.line{box-shadow:inset 0 0 0 1px #A9A292;color:var(--ink)}

/* the live preview */
.pv{position:relative;background:#E4E0D6;border-left:1px solid var(--rule);padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden}
.pv-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute)}
.pv-h .dv{display:inline-flex;padding:3px;border-radius:999px;background:#D9D4C8}
.pv-h .dv span{padding:4px 10px;border-radius:999px;font-size:12px}
.pv-h .dv span.on{background:var(--paper);color:var(--ink)}
.frame{flex:1;position:relative;border-radius:8px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px #CFC9BB,0 24px 50px -30px rgba(22,24,29,.5);min-height:440px}
.frame .sc{position:absolute;inset:0;overflow:hidden}
.pv-cap{font-size:12px;color:var(--soft)}

/* mini site: six looks as tokens */
.ms{--bg:#F3EEE6;--ink:#2A211B;--acc:#5B2A2A;--mut:#6B5D52;--hd:"Libre Caslon Text",Georgia,serif;--tx:"Libre Franklin",sans-serif;--hw:400;--hs:-.01em;--case:none;background:var(--bg);color:var(--ink);font-family:var(--tx);min-height:100%;transform-origin:0 0}
.ms nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;font-size:11.5px}
.ms nav b{font:var(--hw) 17px/1 var(--hd);letter-spacing:var(--hs);text-transform:var(--case);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.ms nav .lg{width:22px;height:22px;border-radius:50%;background:var(--acc);margin-right:8px;display:inline-block;vertical-align:-6px}
.ms nav span{display:flex;gap:14px;white-space:nowrap;overflow:hidden}
.ms nav span i{font-style:normal;opacity:.82}
.ms .hero{position:relative;margin:0 14px;border-radius:3px;overflow:hidden;height:250px;background:#3a2a1e}
.ms .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ms .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,14,10,.74),rgba(20,14,10,.2) 60%,rgba(20,14,10,0))}
.ms .hero .t{position:absolute;z-index:1;left:22px;bottom:22px;right:30%;color:#FBF6EE}
.ms h2{font:var(--hw) 34px/1 var(--hd);letter-spacing:var(--hs);text-transform:var(--case)}
.ms .hero p{font-size:12.5px;line-height:1.45;margin-top:8px;opacity:.92;max-width:40ch}
.ms .cta{display:inline-block;margin-top:12px;padding:8px 14px;background:#FBF6EE;color:#1a1a1a;font-size:11.5px;font-weight:600;border-radius:2px}
.ms .sec{padding:18px 22px 4px}
.ms h3{font:var(--hw) 18px/1.1 var(--hd);letter-spacing:var(--hs);text-transform:var(--case);margin-bottom:10px}
.ms .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ms .row3 img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:2px}
.ms .row3 small{display:block;font-size:10.5px;margin-top:5px;color:var(--mut)}
.ms .info{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:11.5px;color:var(--mut)}
.ms .info b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.ms .btns{display:flex;flex-wrap:wrap;gap:8px}
.ms .btns span{padding:8px 12px;border-radius:2px;background:var(--acc);color:#fff;font-size:11px;font-weight:600}
.ms .btns span.o{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px currentColor}
.ms .add{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;font:500 11px var(--body);color:#2D6CDF;background:rgba(45,108,223,.1)}
/* look variants */
.ms.street{--bg:#EFEDE6;--ink:#141412;--acc:#C8372D;--mut:#5A5850;--hd:"Big Shoulders Display",sans-serif;--tx:"Public Sans",sans-serif;--hw:800;--hs:0;--case:uppercase}
.ms.street h2{font-size:46px;line-height:.9}
.ms.street .hero{height:270px;margin:0;border-radius:0}
.ms.classic{}
.ms.clean{--bg:#FFFFFF;--ink:#121417;--acc:#1F5C4A;--mut:#5C6168;--hd:"Familjen Grotesk",sans-serif;--tx:"Hanken Grotesk",sans-serif;--hw:600;--hs:-.03em}
.ms.clean .hero{height:auto;background:none;margin:0 22px}
.ms.clean .hero:after{display:none}
.ms.clean .hero img{position:relative;height:170px;border-radius:8px;margin-top:14px}
.ms.clean .hero .t{position:relative;left:0;bottom:0;right:0;color:var(--ink);padding-top:8px}
.ms.clean .hero .cta{background:var(--acc);color:#fff;border-radius:999px}
.ms.night{--bg:#0E0F12;--ink:#EDEBE6;--acc:#9DB8FF;--mut:#9EA2AA;--hd:Syne,sans-serif;--tx:"IBM Plex Sans",sans-serif;--hw:700;--hs:-.02em}
.ms.night .btns span{color:#0E0F12}
.ms.night .hero{margin:0;border-radius:0;height:280px}
.ms.night .hero .t{left:50%;transform:translateX(-50%);text-align:center;right:auto;width:80%;bottom:50%;translate:0 50%}
.ms.night .hero:after{background:linear-gradient(0deg,rgba(14,15,18,.85),rgba(14,15,18,.35))}
.ms.night .hero .cta{background:var(--acc);color:#0E0F12}
.ms.soft{--bg:#F5EFEA;--ink:#3B2F33;--acc:#8C5A6B;--mut:#7A6A6E;--hd:"Bodoni Moda",serif;--tx:Jost,sans-serif;--hw:500;--hs:-.01em}
.ms.soft .hero{height:auto;background:none;margin:6px 22px 0;text-align:center}
.ms.soft .hero:after{display:none}
.ms.soft .hero .t{position:relative;inset:auto;color:var(--ink);padding:10px 0 14px}
.ms.soft .hero h2{font-style:italic;font-size:38px}
.ms.soft .hero p{margin-left:auto;margin-right:auto}
.ms.soft .hero img{position:relative;height:150px;border-radius:120px 120px 4px 4px}
.ms.soft .hero .cta{background:var(--acc);color:#fff;border-radius:999px}
.ms.studio{--bg:#EAEAE6;--ink:#111;--acc:#111;--mut:#555;--hd:"Host Grotesk",sans-serif;--tx:Newsreader,serif;--hw:600;--hs:-.045em}
.ms.studio .hero{height:auto;background:none;margin:0 22px;display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:end}
.ms.studio .hero:after{display:none}
.ms.studio .hero .t{position:relative;inset:auto;color:var(--ink);padding:16px 0 4px}
.ms.studio .hero h2{font-size:44px;line-height:.92}
.ms.studio .hero img{position:relative;height:200px;border-radius:0}
.ms.studio .hero .cta{background:var(--ink);color:#fff;border-radius:0}

/* look picker */
.looks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lk{display:block;text-align:left;border-radius:10px;background:var(--pane);box-shadow:inset 0 0 0 1px var(--rule);padding:8px 8px 10px;transition:box-shadow .2s}
.lk:hover{box-shadow:inset 0 0 0 1px #A9A292}
.lk[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--blue);background:var(--blue-t)}
.lk .th{display:block;height:118px;border-radius:6px;overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.lk .th .ms{position:absolute;left:0;top:0;width:620px;pointer-events:none}
.lk b{display:block;font-weight:600;font-size:14.5px;margin:9px 4px 0}
.lk small{display:block;color:var(--mute);font-size:12.5px;margin:1px 4px 0}

/* pages picker */
.pgs{display:grid;gap:8px}
.pg{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-radius:10px;background:var(--pane);box-shadow:inset 0 0 0 1px var(--rule)}
.pg[aria-pressed=true]{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink)}
.pg .ck{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 1.5px #B8B1A1;display:grid;place-items:center;flex:none}
.pg[aria-pressed=true] .ck{background:var(--ink);box-shadow:none;color:#fff}
.pg .ck svg{width:12px;height:12px;opacity:0}.pg[aria-pressed=true] .ck svg{opacity:1}
.pg b{font-weight:600;font-size:15px}
.pg small{color:var(--mute);font-size:12.5px;margin-left:auto;text-align:right}
.pg.lock{opacity:.9}.pg.lock .ck{background:var(--ink);box-shadow:none;color:#fff}.pg.lock .ck svg{opacity:1}
.addpg{display:flex;gap:8px}
.addpg .in{min-height:46px}

/* uploads */
.drop{display:grid;place-items:center;text-align:center;gap:6px;min-height:150px;border-radius:12px;border:1.5px dashed #B8B1A1;background:var(--pane);padding:18px;color:var(--mute);font-size:14px}
.drop b{color:var(--ink);font-size:15.5px}
.drop svg{width:26px;height:26px;color:var(--blue)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.thumbs .tip{grid-column:1/-1;font-size:12.5px;color:var(--mute)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}

/* building */
.build{display:grid;gap:10px;margin-top:26px}
.build li{list-style:none;display:flex;align-items:center;gap:12px;font-size:15px;color:var(--mute);padding:10px 0;border-top:1px solid var(--rule)}
.build li i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #B8B1A1;flex:none;display:grid;place-items:center}
.build li.done{color:var(--ink)}
.build li.done i{background:#1E7A45;box-shadow:none;color:#fff}
.build li.now i{box-shadow:inset 0 0 0 2px var(--blue);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.build li i svg{width:11px;height:11px}

/* the editor */
.ed{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr) 300px;min-height:0;background:#E4E0D6}
.ed .side{background:var(--paper);border-right:1px solid var(--rule);padding:16px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0}
.ed .side h4,.ed .aip h4{font:500 12px var(--body);color:var(--soft);margin:6px 8px 8px}
.ed .side .p{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;color:var(--ink)}
.ed .side .p.on{background:#E8E4DA;font-weight:600}
.ed .side .p small{color:var(--soft);font-weight:400}
.ed .side .p.new{background:var(--blue-t);color:var(--blue-d)}
.ed .side .sp{flex:1}
.ed .side .add{color:var(--blue);padding:9px 10px;text-align:left;font-size:14px}
.ed .side .lib{margin-top:8px;border-top:1px solid var(--rule);padding-top:10px}
.ed .side .lib div{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px}
.ed .side .lib div i{width:28px;height:20px;border-radius:3px;background:#DCD7CB;flex:none}
.ed .side .lib div.drag{background:#fff;box-shadow:0 0 0 1.5px var(--blue),0 14px 24px -14px rgba(0,0,0,.4);transform:translateX(14px) rotate(-1deg)}
.ed .cv{position:relative;padding:20px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ed .cv .frame{min-height:0}
.ed .tbar{position:absolute;z-index:3;display:flex;gap:2px;padding:4px;border-radius:10px;background:var(--night);color:#E8E6E1;font-size:12.5px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
.ed .tbar span{padding:6px 9px;border-radius:7px;white-space:nowrap}
.ed .tbar span.on{background:#2A2F38}
.ed .tbar span.ai{color:#B9CCF5}
.sel{position:absolute;z-index:2;pointer-events:none;border:2px solid var(--blue);border-radius:4px}
.sel i{position:absolute;top:-24px;left:-2px;padding:3px 8px;border-radius:5px 5px 5px 0;background:var(--blue);color:#fff;font:600 11px/1.3 var(--body);font-style:normal;white-space:nowrap}
.sel.drop{border-style:dashed;background:rgba(45,108,223,.08)}
.caret{display:inline-block;width:2px;height:.85em;background:currentColor;vertical-align:-.05em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ed .aip{background:var(--paper);border-left:1px solid var(--rule);display:flex;flex-direction:column;padding:16px 14px;min-width:0;font-size:14px}
.ed .msgs{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.m{padding:10px 12px;border-radius:12px;line-height:1.45;max-width:100%}
.m.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.m.a{background:#EAE6DD;border-bottom-left-radius:4px}
.m .c{display:block;margin-top:6px;font-size:12.5px;color:var(--mute)}
.m.u .c{color:#D6E2FA}
.drafts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.drafts img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px}
.drafts img.pk{outline:2.5px solid var(--blue);outline-offset:1px}
.confirm{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.confirm .btn{min-height:44px;font-size:14.5px}
.ed .box{margin-top:10px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px #CFC9BB;padding:10px 12px;min-height:76px;display:flex;flex-direction:column;gap:8px}
.ed .box .tx{flex:1;color:var(--ink);line-height:1.45}
.ed .box .tx:empty:before{content:"Ask for a photo, a video, a change\2026";color:var(--soft)}
.ed .box .row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute)}
.ed .box .row b{color:var(--ink)}
.ed .box .send{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.ed .box .send svg{width:15px;height:15px}
.etop{display:flex;align-items:center;gap:12px;height:60px;padding:0 16px 0 20px;border-bottom:1px solid var(--rule);background:var(--paper);font-size:14px}
.etop .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.etop .sp{flex:1}
.etop .cr{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:#E8E4DA;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.etop .cr.low{background:#FBE3E0;color:#9B2C22}
.etop .cr svg{width:14px;height:14px}
.etop .undo{color:var(--mute);font-size:13.5px;white-space:nowrap}
.etop .dv{display:inline-flex;padding:3px;border-radius:999px;background:#E2DDD1}
.etop .dv span{padding:5px 11px;border-radius:999px;font-size:12.5px}
.etop .dv span.on{background:#fff}
.etop .pub{min-height:40px;padding:0 18px;font-size:14.5px}
/* sheets */
.sheet{position:absolute;z-index:6;inset:0;background:rgba(22,24,29,.38);display:grid;place-items:center;padding:20px}
.sheet .pn{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--paper);border-radius:14px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);padding:24px}
.sheet h2{font:800 26px/1.08 var(--display);font-variation-settings:"wdth" 108;letter-spacing:-.025em}
.sheet .lead{color:var(--mute);margin-top:8px;font-size:15px}
.packs{display:grid;gap:8px;margin-top:18px}
.pack{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;background:var(--pane);box-shadow:inset 0 0 0 1px var(--rule);text-align:left;width:100%}
.pack[aria-pressed=true]{background:var(--blue-t);box-shadow:inset 0 0 0 2px var(--blue)}
.pack b{font-weight:600}
.pack small{color:var(--mute);font-size:13px;display:block}
.pack .pr{margin-left:auto;font:800 22px/1 var(--display);font-variation-settings:"wdth" 108;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sheet .fine{font-size:12.5px;color:var(--soft);margin-top:12px}
.sheet .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.pubg{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:18px}
.pubg h4{font:500 12.5px var(--body);color:var(--soft);margin:14px 0 8px}
.dom{display:flex;gap:8px}
.dom .in{min-height:46px}
.domr{margin-top:8px;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:#E5F2EA;color:#1E5C38;font-size:14px}
.domr b{color:#123D25}
.sum{display:grid;gap:0;margin-top:6px;font-size:14.5px}
.sum div{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--rule)}
.sum div.t{font-weight:600;font-size:16px}
.live{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:clamp(24px,4vw,44px)}
.live .done{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:#E5F2EA;color:#1E5C38;font-weight:600;font-size:13.5px}
.live h1{font:800 clamp(30px,3.2vw,42px)/1.04 var(--display);font-variation-settings:"wdth" 108;letter-spacing:-.03em;margin-top:14px}
.live .lead{color:var(--mute);margin-top:10px}
.live .url{margin-top:16px;display:flex;gap:8px;align-items:center;padding:12px 14px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px #CFC9BB;font-weight:600}
.live .rows{margin-top:18px}
.live .rows div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--rule);font-size:14.5px}
.live .rows div span{color:var(--mute)}
.live .care{margin-top:18px;padding:16px;border-radius:12px;background:var(--pane);box-shadow:inset 0 0 0 1px var(--rule)}
.live .care b{display:block}
.live .care p{color:var(--mute);font-size:14px;margin-top:4px}

@media (max-width:980px){
 .body{grid-template-columns:1fr}
 .pv{border-left:0;border-top:1px solid var(--rule)}
 .frame{min-height:380px}
 .ed{grid-template-columns:1fr}
 .ed .side{display:none}
 .ed .aip{border-left:0;border-top:1px solid var(--rule)}
 .ed .cv .frame{min-height:420px}
 .live{grid-template-columns:1fr}
 .pubg{grid-template-columns:1fr}
}
@media (max-width:620px){
 .top{gap:10px;padding:0 14px}
 .top a.call{display:none}
 .prog .bar{display:none}
 .ask{padding:24px 16px 18px}
 .looks{grid-template-columns:1fr 1fr;gap:8px}
 .lk .th{height:96px}
 .two{grid-template-columns:1fr}
 .foot{padding:12px 14px;gap:8px}
 .meter{flex-direction:column;gap:2px;align-items:flex-start}
 .meter .fr{display:none}
 .btn.back{padding:0 8px}

}

/* 10-30: subscription, find-your-business, choose-for-me, three looks, shuffle */
.prog .saved{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;background:#E5F2EA;color:#1E5C38;font-size:12px;font-weight:600;white-space:nowrap}
.prog .saved svg{width:11px;height:11px}
.chooser{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:44px;padding:0 16px;border-radius:999px;background:var(--blue-t);color:var(--blue-d);font-weight:600;font-size:14.5px}
.chooser svg{width:17px;height:17px}
.chooser:hover{background:#D4E2FA}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;min-height:58px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px #CFC9BB,0 8px 18px -12px rgba(22,24,29,.35);font-weight:600;font-size:16px;color:var(--ink)}

.gres{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:12px;background:#E5F2EA}

.gres .ok svg{width:13px;height:13px}
.gres b{display:block;font-weight:600}
.gres small{display:block;color:#3E5A48;font-size:13px;margin-top:2px}
.or{text-align:center;font-size:13px;color:var(--soft);margin:4px 0}
.from{font-style:normal;margin-left:6px;padding:2px 7px;border-radius:999px;background:#E5F2EA;color:#1E5C38;font-size:11.5px;font-weight:600}
.sugg{align-items:center}
.sugg .sl{font-size:13px;color:var(--mute);margin-right:2px}
.sugg .chip{min-height:36px;font-size:13.5px;white-space:normal;text-align:left;padding:6px 12px}
.looks3{display:grid;gap:10px}
.looks3 .lk{display:grid;grid-template-columns:150px minmax(0,1fr);grid-template-rows:auto auto;column-gap:14px;align-items:center;padding:8px}
.looks3 .lk .th{grid-row:1/3;height:96px}
.looks3 .lk b{margin:0;align-self:end}
.looks3 .lk small{margin:0;align-self:start}
.more{align-self:flex-start;font-size:14px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:#C9C3B5;min-height:36px}
.etop .shuf{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;border-radius:999px;box-shadow:inset 0 0 0 1px #CFC9BB;font-size:13.5px;font-weight:500;white-space:nowrap}
.etop .shuf svg{width:15px;height:15px}
.etop .shuf.on{background:var(--blue-t);color:var(--blue-d);box-shadow:inset 0 0 0 1.5px var(--blue)}
.undobar{position:absolute;z-index:4;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;border-radius:999px;background:var(--night);color:#E8E6E1;font-size:13.5px;white-space:nowrap;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}
.undobar button{padding:6px 12px;border-radius:999px;background:#2A2F38;color:#fff;font-size:13px;font-weight:600}
.undobar button:first-of-type{background:#fff;color:var(--ink)}
.bill2{display:inline-flex;gap:4px;margin-top:14px;padding:4px;border-radius:999px;background:#E8E4DA}
.bill2 button{min-height:38px;padding:0 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mute);display:inline-flex;align-items:center;gap:6px}
.bill2 button[aria-pressed=true]{background:#fff;color:var(--ink)}
.bill2 i{font-style:normal;font-size:11.5px;padding:2px 7px;border-radius:999px;background:#E5F2EA;color:#1E5C38}
.pack .pr small{font:500 13px var(--body);color:var(--mute)}
.pack .pr.sm{font:600 15px var(--body)}
.care.grow{background:var(--blue-t);box-shadow:none}
@media (max-width:620px){.looks3 .lk{grid-template-columns:110px minmax(0,1fr)}.looks3 .lk .th{height:76px}.etop .shuf{padding:0 10px;font-size:0;gap:0}.etop .shuf svg{width:17px;height:17px}.undobar{font-size:12.5px;bottom:10px}.prog .saved{display:none}}
.etop .undo{display:inline-flex;align-items:center;gap:6px}
.etop .undo svg{width:12px;height:12px;color:#1E7A45}
@media (max-width:620px){.etop .undo{display:none}.etop .cr{padding:6px 9px;font-size:12.5px}.etop .pub{padding:0 14px}}

/* marketplace (modelled on 21st.dev's library) */
.sheet.mk{padding:16px;align-items:stretch}
.mkp{width:100%;max-width:1100px;margin:0 auto;background:var(--paper);border-radius:16px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);padding:20px 22px;overflow:auto;max-height:100%}
.mkh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.mkh h2{font:800 26px/1.05 var(--display);font-variation-settings:"wdth" 108;letter-spacing:-.025em}
.mkh p{color:var(--mute);font-size:14.5px;margin-top:4px}
.mx{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--rule);font-size:22px;line-height:1;color:var(--mute)}
.mtabs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:16px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.mtabs>button{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mute)}
.mtabs>button.on{background:var(--ink);color:var(--paper)}
.mtabs i,.mchip i{font-style:normal;font-weight:500;font-size:12px;opacity:.7}
.msearch{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:240px;padding:0 10px;min-height:40px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px #CFC9BB}
.msearch svg{width:16px;height:16px;color:var(--soft)}
.msearch input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px}
.msearch kbd{font:500 11.5px var(--body);color:var(--soft);padding:2px 6px;border-radius:5px;background:#EFEBE2}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none;align-items:center}
.mchips::-webkit-scrollbar{display:none}
.mchip{flex:none;min-height:34px;padding:0 12px;border-radius:999px;background:#EFEBE2;font-size:13.5px;white-space:nowrap}
.mchip.on{background:var(--blue-t);color:var(--blue-d);font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mcard{display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer}
.mcard .mth{display:block;aspect-ratio:16/10;border-radius:10px;overflow:hidden;background:#E4E0D6;box-shadow:0 0 0 1px var(--rule);margin-bottom:6px;transition:transform .2s}
.mcard:hover .mth{transform:translateY(-2px)}
.mcard.pk .mth{box-shadow:0 0 0 2.5px var(--blue)}
.mcard .mth img{width:100%;height:100%;object-fit:cover}
.mcard b{font-weight:600;font-size:14px;line-height:1.25}
.mcard small{color:var(--mute);font-size:12.5px}
.mtag{align-self:flex-start;margin-top:2px;padding:2px 8px;border-radius:999px;font:600 11.5px/1.6 var(--body)}
.mtag.free{background:#E5F2EA;color:#1E5C38}
.mtag.pro{background:var(--blue-t);color:var(--blue-d)}
.mtag.cr{background:#fff;color:var(--blue-d)}
.mcard.ai{justify-content:center;padding:16px;border-radius:10px;background:var(--blue-t);aspect-ratio:auto}
.mcard.ai .mai{width:40px;height:40px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;margin-bottom:10px}
.mcard.ai .mai svg{width:22px;height:22px}
.mcrumb{font-size:13px;color:var(--mute)}
.mcrumb b{color:var(--ink)}
.mdet{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px;margin-top:16px;align-items:start}
.mdet h2{font:800 28px/1.05 var(--display);font-variation-settings:"wdth" 108;letter-spacing:-.025em}
.mfacts{list-style:none;padding:0;margin:16px 0;display:grid;gap:8px;font-size:14.5px}
.mfacts li{display:flex;gap:8px;align-items:center}
.mfacts svg{width:16px;height:16px;color:#1E7A45}
.mdet .btn svg{width:18px;height:18px}
.mbig{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--rule),0 24px 50px -30px rgba(0,0,0,.5);background:#E4E0D6}
.mbig img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.mbig .dv{position:absolute;top:10px;right:10px;display:inline-flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.9)}
.mbig .dv span{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px}
.mbig .dv span.on{background:var(--ink);color:#fff}
.mbig .dv svg{width:13px;height:13px}
.mopts{margin-left:auto;font-size:13px;color:var(--mute);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.mopts b{color:var(--ink)}
.sw1{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--blue)}
.igrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.ic1{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px 10px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule)}
.ic1 svg{width:24px;height:24px}
.ic1 small{font-size:11px;color:var(--mute);text-align:center;line-height:1.2}
.ic1.pk{box-shadow:inset 0 0 0 2px var(--blue);color:var(--blue-d)}
.box2{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px #CFC9BB;font-size:15px}
.chips.sty{margin-top:12px}
.drafts4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.drafts4 img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.drafts4 img.pk{outline:3px solid var(--blue);outline-offset:1px}
@media (max-width:980px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.mdet{grid-template-columns:1fr}.igrid{grid-template-columns:repeat(4,minmax(0,1fr))}.msearch{min-width:0;flex:1 1 100%;margin-left:0}.mopts{display:none}}
@media (max-width:620px){.drafts4{grid-template-columns:repeat(2,1fr)}.sheet.mk{padding:8px}.mkp{padding:16px}}

/* step 5 add-ons */
.addons{display:grid;gap:6px;margin:-4px 0 4px 18px;padding-left:12px;border-left:2px solid #CFDDF8}
.addon{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:'tg an ap' 'ad ad ad';gap:6px 10px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);text-align:left}
.addon .tg{width:34px;height:20px;border-radius:999px;background:#D9D4C8;position:relative;flex:none;transition:background .2s}
.addon .tg i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.addon.on{box-shadow:inset 0 0 0 1.5px var(--blue);background:var(--blue-t)}
.addon.on .tg{background:var(--blue)}
.addon.on .tg i{transform:translateX(14px)}
.addon .tg{grid-area:tg}.addon .an{grid-area:an;font-size:14px;font-weight:600}.addon .ad{grid-area:ad;font-size:12.5px;color:var(--mute);line-height:1.4}
.addon .at small{display:block;font-size:12px;color:var(--mute);line-height:1.35;margin-top:1px}
.addon .ap{grid-area:ap;font:700 14.5px var(--body);text-align:right;white-space:nowrap}
.addon .ap small{display:block;font-weight:500;font-size:11px;color:var(--mute)}
.sum .adl small{color:#1E5C38;font-size:12px;margin-left:4px}
/* step 8 catalog */
.catwrap{flex:1;padding:clamp(24px,3vw,40px) clamp(16px,3vw,40px) 24px;min-width:0}
.cath{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.cath h1{font:800 clamp(30px,3.2vw,44px)/1.02 var(--display);font-variation-settings:"wdth" 108;letter-spacing:-.03em}
.cath h1 em{font-style:normal;font-weight:400;font-variation-settings:"wdth" 92;color:var(--blue)}
.cath .k{font-size:13.5px;color:var(--mute);margin-bottom:10px}
.cath .lead{margin-top:10px;color:var(--mute);max-width:56ch}
.cath .msearch{margin-left:0;min-width:280px}
.mgrid.cat{margin-top:4px}
.mgrid.cat .mcard{text-align:left;background:none;padding:0;border:0}
.mcard .mth{position:relative}
.mcard .madd,.mcard .mon{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;font:600 12.5px var(--body);box-shadow:0 6px 14px -6px rgba(0,0,0,.4)}
.mcard .madd{background:#fff;color:var(--ink);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.mcard:hover .madd,.mcard:focus-visible .madd{opacity:1;transform:none}
.mcard .mon{background:var(--blue);color:#fff}
.mcard .madd svg,.mcard .mon svg{width:14px;height:14px}
.mcard.prod .mth:after{content:"Station";position:absolute;left:8px;top:8px;padding:3px 8px;border-radius:999px;background:#16181D;color:#fff;font:600 11px var(--body)}
.foot .picked{font-size:13.5px;font-weight:600;color:var(--blue-d);white-space:nowrap}
@media (hover:none){.mcard .madd{opacity:1;transform:none}}
@media (max-width:620px){.addons{margin-left:6px;padding-left:8px}.cath .msearch{min-width:0;flex:1 1 100%}}

/* add-on clarity */
.addon .aok{grid-column:1/-1;display:flex;gap:8px;align-items:flex-start;margin-top:4px;padding:8px 10px;border-radius:8px;background:#fff;font-size:12.5px;line-height:1.45;color:var(--ink)}
.addon .aok svg{flex:none;width:14px;height:14px;margin-top:2px;color:#1E7A45}
.meter.clk{cursor:pointer;border-radius:10px;padding:6px 8px;margin:-6px -8px;transition:background .15s}
.meter.clk:hover{background:#ECE8DF}
.meter .seebill{font-size:13px;font-weight:600;color:var(--blue-d);text-decoration:underline;text-underline-offset:3px;margin-left:4px}
.sum small{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px;border-radius:10px;background:var(--blue-t);font-size:13.5px;line-height:1.45;cursor:pointer}
.consent input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--blue)}
.setup{margin-top:18px;padding:16px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule)}
.setup>b{display:block;margin-bottom:6px}
.setup .su{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 0;border-top:1px solid var(--rule)}
.setup .sn{font-weight:600}
.setup .st{justify-self:end;font-size:13px;color:#1E5C38;font-weight:600}
.setup small{grid-column:1/-1;color:var(--mute);font-size:13px}
.setup p{font-size:13px;color:var(--mute);margin-top:8px}
/* add-ons drawn on the live preview */
.ov-tag{font-style:normal;display:inline-block;padding:2px 7px;border-radius:999px;background:#16181D;color:#fff;font:600 10px/1.5 var(--body)}
.ov-tag.ov-in{position:absolute;right:16px;top:12px}
.ov-chat{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:2}
.ov-msg{max-width:190px;padding:8px 10px;border-radius:12px 12px 2px 12px;background:#fff;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);font:500 11.5px/1.4 var(--body);color:#16181D}
.ov-bub{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 10px 20px -8px rgba(45,108,223,.8)}
.ov-bub svg{width:22px;height:22px}
.ov-call{position:absolute;left:12px;top:44px;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#fff;box-shadow:0 8px 20px -10px rgba(0,0,0,.4);font:600 11.5px var(--body);color:#16181D;z-index:2}
.ov-call svg{width:14px;height:14px;color:var(--blue)}
.ms .ov-sec{position:relative;margin:10px 14px 0;padding:14px 16px;border-radius:6px;box-shadow:inset 0 0 0 1.5px rgba(45,108,223,.55);background:rgba(45,108,223,.05)}
.ov-cal{display:flex;gap:6px}
.ov-cal span{flex:1;text-align:center;padding:6px 0;border-radius:4px;background:rgba(127,127,127,.12);font-size:10.5px}
.ov-cal span b{display:block;font-size:11px}
.ov-cal span.on{background:var(--acc);color:#fff}
.ov-rev{font-size:11.5px;color:var(--mut)}
.ov-rev b{color:var(--ink);letter-spacing:1px}

/* keep the preview in view while the questions scroll; open the bill over the screen */
@media (min-width:981px){.body{align-items:start}.body>.pv{position:sticky;top:64px;height:calc(100vh - 150px);min-height:520px}}
.sheet[data-a=billx]{position:fixed;z-index:40}
.app{overflow:clip}
.meter .fr{overflow:hidden;text-overflow:ellipsis;min-width:0}
.meter .seebill{flex:none}
.mcard .mth img{object-position:top center}
.mbig img{object-position:top center}
.mcard .mth img,.mbig img{object-fit:initial;height:auto;min-height:100%;width:100%}
.mcard .mth{background:#E8E3D8}

/* real designs in the preview and look picker */
.frame.real{background:#fff}
.frame.real iframe.dz{position:absolute;left:0;top:0;width:1280px;border:0;transform-origin:0 0;pointer-events:none}
.looks3.real .lk{grid-template-columns:170px minmax(0,1fr)}
.looks3.real .lk .th{height:106px;background:#E4E0D6}
.looks3.real .lk .th img{width:100%;height:100%;object-fit:cover;object-position:top}
.looks3.real .lk small{font-size:12.5px;line-height:1.4}
.looks3.real .lk{display:block;padding:8px 8px 12px}
.looks3.real .lk .th{display:block;height:auto;aspect-ratio:16/9;margin-bottom:10px}
.looks3.real .lk b{display:block;margin:0 4px}
.looks3.real .lk small{display:block;margin:4px 4px 0}
.ov-added{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;z-index:2}
.ov-added span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#fff;box-shadow:0 8px 20px -10px rgba(0,0,0,.45);font:600 11.5px var(--body);color:#16181D}
.ov-added span svg{width:13px;height:13px;color:var(--blue)}
.ov-added i{font-style:normal;font-weight:500;color:var(--mute)}
.ov-added small{font:600 10.5px var(--body);color:#fff;background:var(--blue);padding:2px 8px;border-radius:999px}
.ov-call{top:52px}

/* v3: quick start page */
.body.q{grid-template-columns:minmax(420px,1fr) minmax(0,1fr)}
.body.q .ask h1{font-size:clamp(28px,2.6vw,38px)}
.qform{margin-top:22px;display:grid;gap:0}
.qrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--rule)}
.ql b{display:block;font-weight:600;font-size:14.5px}
.ql small{display:block;color:var(--mute);font-size:12.5px;line-height:1.35;margin-top:3px}
.qb{min-width:0;display:grid;gap:10px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips .chip{min-height:38px;font-size:14px;padding:0 13px}
.inrow{display:flex;gap:8px}
.inrow .in{min-height:44px}
.helpme{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 13px;border-radius:999px;background:var(--blue-t);color:var(--blue-d);font-weight:600;font-size:13.5px;white-space:nowrap}
.helpme svg{width:15px;height:15px}
.helpme i{font-style:normal;font-weight:500;font-size:11.5px;padding:1px 6px;border-radius:999px;background:#fff}
.helpme.ghost{background:none;box-shadow:inset 0 0 0 1px #CFC9BB;color:var(--ink)}
.gbtn.sm{min-height:46px;font-size:14.5px;justify-content:flex-start;padding:0 14px}
.addons.q{margin:2px 0 0 0;padding-left:10px}
.sizes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.size{display:grid;gap:2px;padding:10px 8px;border-radius:10px;background:var(--pane);box-shadow:inset 0 0 0 1px var(--rule);text-align:left}
.size b{font-size:14px}.size small{font-size:11.5px;color:var(--mute)}
.size[aria-pressed=true]{background:var(--blue-t);box-shadow:inset 0 0 0 2px var(--blue)}
.qlooks{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,42%);gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.qlk{scroll-snap-align:start;text-align:left;padding:6px 6px 8px;border-radius:10px;background:var(--pane);box-shadow:inset 0 0 0 1px var(--rule)}
.qlk span{display:block;aspect-ratio:16/10;border-radius:6px;overflow:hidden;margin-bottom:6px}
.qlk img{width:100%;height:100%;object-fit:cover;object-position:top}
.qlk b{font-size:13.5px;margin:0 2px}
.qlk[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--blue);background:var(--blue-t)}
.qgo{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--rule)}
.btn.big{min-height:56px;padding:0 24px;font-size:16.5px}
.btn.big svg{width:18px;height:18px}
.sheet.fx{position:fixed;z-index:40}
.gift{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--blue);color:#fff;margin-bottom:14px}
.gift svg{width:26px;height:26px}
.why3{list-style:none;padding:0;margin:16px 0;display:grid;gap:8px;font-size:14.5px}
.why3 li{display:flex;gap:8px;align-items:flex-start}
.why3 svg{width:16px;height:16px;color:#1E7A45;flex:none;margin-top:3px}
.in.mock{display:flex;align-items:center;gap:10px;color:var(--soft)}
.in.mock svg{width:18px;height:18px;color:var(--mute)}
.in.mock .mm{margin-left:auto}
/* v3: the builder */
.etop.bt .btabs{display:flex;gap:2px;padding:3px;border-radius:999px;background:#E8E4DA}
.etop.bt .btabs button{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:500;color:var(--mute)}
.etop.bt .btabs button svg{width:15px;height:15px}
.etop.bt .btabs button.on{background:#fff;color:var(--ink)}
.bld{flex:1;display:grid;grid-template-columns:380px minmax(0,1fr);min-height:0;background:#E4E0D6}
.chat{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--paper);border-right:1px solid var(--rule);min-width:0}
.cms{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:200px}
.cm{padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.45;max-width:92%}
.cm.u{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.cm.a{background:#EAE6DD;border-bottom-left-radius:4px}
.cm .c{display:block;margin-top:6px;font-size:12px;opacity:.8}
.cm .lnk{border:0;background:none;padding:0;font:inherit;color:var(--blue);text-decoration:underline;cursor:pointer}
.cm.wait{color:var(--mute)}
.spin{display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.frame.real.live iframe.dz{pointer-events:auto}
.lwait{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute);font-size:14px}
.cm.a .c{color:var(--mute);opacity:1}
.pops{display:grid;gap:6px;margin-top:10px}
.pop{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;padding:9px 11px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);text-align:left;font-size:13.5px}
.pop:hover{box-shadow:inset 0 0 0 1.5px var(--blue)}
.pop b{flex:none;font-size:12px;color:var(--blue-d);background:var(--blue-t);padding:2px 8px;border-radius:999px}
.sugs{display:grid;gap:6px}
.sugs p{font-size:12px;color:var(--soft)}
.pop.sm{padding:7px 10px;font-size:13px}
.composer{border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px #CFC9BB,0 10px 24px -18px rgba(22,24,29,.5);padding:10px}
.composer.has{box-shadow:inset 0 0 0 2px var(--blue)}
.ctx{width:100%;border:0;outline:0;resize:none;font-size:15px;line-height:1.45;background:none}
.crow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.crow .sp{flex:1}
.crow .helpme{min-height:34px;font-size:12.5px;padding:0 10px}
.est{font-size:12px;font-weight:600;color:var(--blue-d);white-space:nowrap}
.crow .send{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.crow .send svg{width:17px;height:17px}
.bview{position:relative;padding:16px;display:flex;min-width:0}
.bview .frame{flex:1;min-height:560px}
.vidb,.chg{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font:600 12.5px var(--body)}
.vidb{top:28px;right:28px;background:rgba(11,13,16,.75);color:#fff}
.chg{top:28px;left:28px;background:#1E7A45;color:#fff}
.vidb svg,.chg svg{width:14px;height:14px}
@media (max-width:1100px){.etop.bt .btabs button span{display:none}}
@media (max-width:980px){.body.q{grid-template-columns:1fr}.bld{grid-template-columns:1fr}.chat{border-right:0;border-bottom:1px solid var(--rule)}.bview .frame{min-height:420px}.cms{min-height:0}.bview .frame.real.live{min-height:640px}.qrow{grid-template-columns:1fr;gap:8px}.sizes{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.etop.bt .btabs{display:none}.qlooks{grid-auto-columns:70%}}

/* catalog allowance */
.cmeter{position:relative;margin-top:14px;padding:10px 12px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);font-size:13.5px}
.cmeter i{display:block;height:5px;border-radius:5px;background:var(--blue);margin-top:8px}
.cmeter.full{background:var(--blue-t);box-shadow:inset 0 0 0 1.5px var(--blue)}
.cmeter em{display:block;font-style:normal;margin-top:8px;color:var(--blue-d);font-weight:600}
.size small+small{color:var(--blue-d)}
.mgrid .mcard{background:none;border:0;padding:0;text-align:left}
.catcard{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--rule);text-align:left}
.catcard:hover{box-shadow:inset 0 0 0 1.5px var(--blue)}
.catcard .cth{display:flex;flex:none}
.catcard .cth img{width:44px;height:32px;object-fit:cover;object-position:top;border-radius:5px;box-shadow:0 0 0 2px #fff;margin-left:-10px}
.catcard .cth img:first-child{margin-left:0}
.catcard .ctx2{flex:1;min-width:0}
.catcard b{display:block;font-size:13.5px}
.catcard small{display:block;font-size:12px;color:var(--mute)}
.catcard>svg{width:16px;height:16px;color:var(--blue);flex:none}
</style>
