<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Book your free 15-minute call · Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#F4F2ED;color:#16181d;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  .page{max-width:860px;margin:0 auto;padding:0 20px 40px}
  header{display:flex;justify-content:space-between;align-items:center;padding:22px 0 18px;border-bottom:1px solid rgba(22,24,29,.12);margin-bottom:28px}
  .wordmark{font-weight:800;font-size:15px;letter-spacing:-.02em;color:#16181d;text-decoration:none}
  .mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8e929c}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:30px;letter-spacing:-.01em;margin-bottom:6px}
  .sub{color:#4a4e57;font-size:15px;margin-bottom:22px}
  .widget{background:#fff;border:1px solid rgba(22,24,29,.12);border-radius:12px;overflow:hidden;min-height:760px}
  .widget iframe{width:100%;min-height:760px;border:none;display:block}
  footer{margin-top:26px;text-align:center;font-size:12.5px;color:#8e929c}
  /* Cookie banner. analytics.js builds #ck with no styles of its own and the site
     stylesheet normally supplies them — this page does not load v5.css, so the rules
     are inlined against this page's own palette. Without them the banner rendered as
     an unstyled block at the bottom of the document. */
  #ck{position:fixed;left:14px;right:auto;bottom:14px;z-index:95;max-width:420px;
   display:flex;flex-direction:column;gap:12px;background:#fff;
   border:1px solid rgba(22,24,29,.12);border-radius:18px;padding:16px 18px;
   box-shadow:0 18px 50px rgba(29,29,31,.16);
   transform:translateY(calc(100% + 20px));transition:transform .4s cubic-bezier(.2,.7,.3,1)}
  #ck.up{transform:none}
  @media(prefers-reduced-motion:reduce){#ck{transition:none}}
  #ck .ck-txt{color:#4a4e57;font-size:12.5px;line-height:1.5}
  #ck .ck-txt b{color:#16181d;font-weight:600}
  #ck .ck-txt a{color:#16181d;font-weight:600}
  #ck .ck-actions{display:flex;gap:10px}
  #ck .ck-accept,#ck .ck-min{flex:1;font:600 13.5px 'Inter',sans-serif;border-radius:999px;
   cursor:pointer;padding:0 18px;min-height:44px;display:inline-flex;align-items:center;
   justify-content:center;transition:background .15s,border-color .15s}
  #ck .ck-accept{background:#16181d;color:#fff;border:0}
  #ck .ck-accept:hover{background:#000}
  #ck .ck-min{background:#fff;color:#16181d;border:1px solid rgba(22,24,29,.18)}
  #ck .ck-min:hover{border-color:#8e929c}
  #ck .ck-accept:focus-visible,#ck .ck-min:focus-visible{outline:2px solid #16181d;outline-offset:3px}
  @media(max-width:560px){
    #ck{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:none}
    #ck .ck-long{display:none}
    #ck .ck-short{display:inline!important}
  }
</style>
</head>
<body>
<div class="page">
  <header><a class="wordmark" href="/">STATION</a><span class="mono">Free 15-minute call</span></header>
  <h1>Grab 15 minutes.</h1>
  <p class="sub">No pitch deck, no contracts — we walk through what we found for your business and you keep the audit either way.</p>
  <div class="widget">
    <iframe src="https://api.leadconnectorhq.com/widget/bookings/station-intro-call" title="Book your call" loading="eager"></iframe>
  </div>
  <footer>Station · station.solutions · main@station.solutions</footer>
</div>
<!-- The booking page had NO analytics and NO Pixel (2026-09-03 audit): reaching the
     booking widget is the strongest intent signal on the site and none of it was ever
     recorded, so these visitors were neither counted nor retargetable. attribution.js
     first so the landing parameters are captured before analytics.js reads them. -->
<script src="/attribution.js" defer></script><script src="/analytics.js" defer></script>
</body>
</html>
