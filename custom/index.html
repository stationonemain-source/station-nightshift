<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your custom website — Station</title>
<meta name="description" content="Tell us about your business, one question at a time, and we'll build a demo of your custom website. Free, no strings.">
<meta name="theme-color" content="#F5F4F1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#F5F4F1;--card:#FFFFFF;--bg-2:#FAF9F6;--bg-3:#F1EFE9;--line:#E7E4DE;--line-2:#DDD9D0;--ink:#1D1D1F;--muted:#5F5F64;--faint:#6E6E73;
--accent:#8A5A00;--gold:#EFC26A;--good:#167A44;--red:#C03B2B;--fd:'Inter','Segoe UI',system-ui,sans-serif;--fm:'JetBrains Mono',Consolas,ui-monospace,monospace}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--fd);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:var(--ink)}
.top{position:sticky;top:0;z-index:10;background:rgba(245,244,241,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:0 22px;height:58px;display:flex;align-items:center;gap:12px}
.home{display:flex;align-items:center;gap:9px;font:700 12px var(--fd);letter-spacing:.13em;text-decoration:none;color:var(--ink)}
.home svg{width:19px;height:19px}
.count{margin-left:auto;font:600 11px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.bar{height:4px;background:var(--bg-3)} .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .35s ease}
main{flex:1;display:flex;align-items:center}
.stage{width:100%;max-width:760px;margin:0 auto;padding:44px 22px 40px}
.slide{animation:in .32s ease both} @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}.bar i{transition:none}}
.k{font:600 11px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
h1{font-size:clamp(1.9rem,4.4vw,2.7rem);line-height:1.12;letter-spacing:-.025em;margin:0 0 12px;font-weight:700;text-wrap:balance}
h2{font-size:clamp(1.45rem,3.4vw,2.05rem);line-height:1.2;letter-spacing:-.02em;margin:0 0 10px;font-weight:700;text-wrap:balance}
.help{color:var(--muted);margin:0 0 22px;max-width:60ch}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea{width:100%;font:500 19px/1.4 var(--fd);color:var(--ink);background:var(--card);border:1.5px solid var(--line-2);border-radius:14px;padding:15px 16px;outline:none}
textarea{min-height:140px;resize:vertical;font-size:17px}
input:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 4px rgba(29,29,31,.07)}
.sub{margin-top:14px} .sub label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
.sub input{font-size:16px;padding:12px 14px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;font:500 16px var(--fd);color:var(--ink);background:var(--card);border:1.5px solid var(--line-2);border-radius:14px;padding:14px 16px;cursor:pointer}
.opt:hover{border-color:var(--faint)} .opt[aria-pressed=true]{border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(29,29,31,.08)}
.opt .box{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:13px;color:#fff}
.opt[aria-pressed=true] .box{background:var(--ink);border-color:var(--ink)}
.opt.radio .box{border-radius:50%}
.opt small{display:block;color:var(--muted);font-size:13.5px;font-weight:400}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.look{padding:0;overflow:hidden;flex-direction:column;align-items:stretch}
.look .sw{height:92px;display:flex;align-items:flex-end;padding:12px 14px;font-weight:700;font-size:20px}
.look .cap{padding:12px 14px}
.colors{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.colors label{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.colors input[type=color]{width:52px;height:40px;border:1.5px solid var(--line-2);border-radius:10px;background:#fff;padding:3px;cursor:pointer}
.drop{border:1.5px dashed var(--line-2);border-radius:16px;background:var(--bg-2);padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--ink);background:#fff}
.drop button{margin-top:8px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.thumb{width:92px;height:92px;border-radius:12px;border:1px solid var(--line);background:#fff center/cover no-repeat;position:relative;display:grid;place-items:center;font:600 11px var(--fm);color:var(--faint);overflow:hidden}
.thumb .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:14px;line-height:24px}
.thumb.busy::after{content:"uploading…";position:absolute;inset:0;background:rgba(255,255,255,.85);display:grid;place-items:center;font:600 11px var(--fm)}
.nav{display:flex;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 16px var(--fd);background:var(--ink);color:#fff;border:0;border-radius:12px;padding:14px 22px;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-2)}
.link{background:none;border:0;font:500 15px var(--fd);color:var(--muted);cursor:pointer;text-decoration:underline;padding:8px 4px}
.hint{font:500 12px var(--fm);color:var(--faint);letter-spacing:.04em}
.err{color:var(--red);font-size:14.5px;margin:10px 0 0;min-height:1.2em}
.review{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 18px;max-height:46vh;overflow:auto}
.review dl{margin:0} .review div{display:grid;grid-template-columns:190px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.review div:first-child{border-top:0} .review dt{color:var(--muted);font-size:14px} .review dd{margin:0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.review button{background:none;border:0;color:var(--accent);font:600 13px var(--fd);cursor:pointer;padding:0;margin-left:6px}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:14.5px;color:var(--muted)}
.consent input{margin-top:4px;width:18px;height:18px}
.done{text-align:center} .done .tick{width:64px;height:64px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;margin:0 auto 20px;font-size:30px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-width:560px){.stage{padding:30px 18px}.review div{grid-template-columns:1fr;gap:2px}.nav .hint{display:none}}
</style></head>

  }
  function validate(q) {
    var err = document.getElementById("err"); if (err) err.textContent = "";
    if (q.req && !answered(q)) { if (err) err.textContent = "Please answer this one to continue."; return false; }
    if (q.id === "email") { var e = String(A.email || "").trim(); if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(e)) { err.textContent = "That email doesn't look right. Check it and try again."; return false; } }
    if ((uploads[q.id] || []).some(function (u) { return u.busy; })) { if (err) err.textContent = "Hang on, a file is still uploading."; return false; }
    return true;
  }
  function go(to) { i = Math.max(0, Math.min(LAST, to)); save(); render(); }
  function next() { var q = Q[i]; collect(q); if (q.type !== "intro" && !validate(q)) return; go(i + 1); }

  function wire(q) {
    var n = document.getElementById("next"), b = document.getElementById("back"), s = document.getElementById("skip"), send = document.getElementById("send");
    if (n) n.onclick = next;
    if (b) b.onclick = function () { collect(q); go(i - 1); };
    if (s) s.onclick = function () { collect(q); go(i + 1); };
    if (send) send.onclick = submit;
    stage.querySelectorAll(".opt[data-o]").forEach(function (el) {
      el.onclick = function () {
        var o = el.getAttribute("data-o");
        if (q.type === "multi") { var arr = A[q.id] || []; var k = arr.indexOf(o); if (k >= 0) arr.splice(k, 1); else arr.push(o); A[q.id] = arr; }
        else A[q.id] = o;
        collect(q); save(); render();
        if (q.type === "choice" && !q.sub) setTimeout(next, 180);   // single choice advances on its own
      };
    });
    stage.querySelectorAll(".opt[data-look]").forEach(function (el) { el.onclick = function () { A.look = el.getAttribute("data-look"); save(); render(); setTimeout(next, 200); }; });
    stage.querySelectorAll(".opt[data-none]").forEach(function (el) { el.onclick = function () { var k = el.getAttribute("data-none") + "_none"; collect(q); A[k] = !A[k]; save(); render(); }; });
    stage.querySelectorAll(".opt[data-extra]").forEach(function (el) { el.onclick = function () { collect(q); var k = q.id + "_extra", arr = A[k] || [], o = el.getAttribute("data-extra"), j = arr.indexOf(o); if (j >= 0) arr.splice(j, 1); else arr.push(o); A[k] = arr; save(); render(); }; });
    stage.querySelectorAll("button[data-edit]").forEach(function (el) { el.onclick = function () { go(Number(el.getAttribute("data-edit"))); }; });
    if (q.type === "upload") wireUpload(q);
  }
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.isComposing) return;
    var t = e.target, q = Q[i];
    if (t && t.tagName === "TEXTAREA" && !(e.metaKey || e.ctrlKey)) return;
    if (t && t.tagName === "BUTTON") return;          // a focused button already clicks itself on Enter
    if (q.type === "review") return;
    e.preventDefault(); next();
  });

  // ---- uploads: each file goes straight to Station's media library -------------------------
  function drawThumbs(id) {
    var box = document.getElementById("thumbs"); if (!box) return;
    box.innerHTML = (uploads[id] || []).map(function (u, k) {
      var img = u.url && /\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(u.url);
      return '<div class="thumb' + (u.busy ? " busy" : "") + '" style="' + (img ? "background-image:url('" + esc(u.url) + "')" : "") + '" title="' + esc(u.name) + '">' + (img ? "" : esc((u.name.split(".").pop() || "FILE").toUpperCase())) +
             (u.busy ? "" : '<button type="button" class="x" data-rm="' + k + '" aria-label="Remove ' + esc(u.name) + '">×</button>') + "</div>";
    }).join("");
    box.querySelectorAll("[data-rm]").forEach(function (b) { b.onclick = function () { uploads[id].splice(Number(b.getAttribute("data-rm")), 1); save(); drawThumbs(id); }; });
  }
  function wireUpload(q) {
    var drop = document.getElementById("drop"), file = document.getElementById("file"), pick = document.getElementById("pick");
    pick.onclick = function () { file.click(); };
    file.onchange = function () { take(q, file.files); file.value = ""; };
    ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
    ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
    drop.addEventListener("drop", function (e) { take(q, e.dataTransfer.files); });
  }
  function take(q, files) {
    var err = document.getElementById("err"); err.textContent = "";
    var list = uploads[q.id] = uploads[q.id] || [];
    Array.prototype.slice.call(files || []).forEach(function (f) {
      if (list.length >= (q.max || MAXN)) { err.textContent = "That's the most files for this question."; return; }
      if (f.size > MAXF) { err.textContent = f.name + " is over 8 MB. Try a smaller file or paste a link instead."; return; }
      if (!/^image\//.test(f.type) && !/pdf/.test(f.type) && !/\.svg$/i.test(f.name)) { err.textContent = f.name + " isn't an image or PDF."; return; }
      var u = { name: f.name, busy: true, url: "" }; list.push(u); drawThumbs(q.id);
      var rd = new FileReader();
      rd.onload = function () {
        var data = String(rd.result).split(",")[1] || "";
        fetch(UPLOAD, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ field: q.id, name: f.name, type: f.type || "application/octet-stream", data: data, hp: document.getElementById("hp").value }) })
          .then(function (r) { return r.json(); })
          .then(function (j) { if (!j || !j.url) throw new Error((j && j.error) || "upload failed"); u.url = j.url; u.busy = false; save(); drawThumbs(q.id); })
          .catch(function () { list.splice(list.indexOf(u), 1); drawThumbs(q.id); var e2 = document.getElementById("err"); if (e2) e2.textContent = "We couldn't upload " + f.name + ". Try again, or paste a link below."; });
      };
      rd.readAsDataURL(f);
    });
  }

  // ---- review + submit --------------------------------------------------------------------
  function val(q) {
    if (q.type === "looks") { var l = LOOKS.filter(function (x) { return x.v === A.look; })[0]; return l ? l.t : ""; }
    if (q.type === "upload") {
      var parts = (uploads[q.id] || []).filter(function (u) { return u.url; }).map(function (u) { return u.name; });
      if (A[q.id + "_link"]) parts.push(A[q.id + "_link"]); if (A[q.id + "_none"]) parts.push(q.none); (A[q.id + "_extra"] || []).forEach(function (x) { parts.push(x); });
      return parts.join("\n");
    }
    if (q.type === "colors") return (A.colors || "") + (A.colors === "Yes, I'll pick them" ? "\n" + [A.color1, A.color2, A.color3].filter(Boolean).join("  ") : "");
    var v = A[q.id]; v = Array.isArray(v) ? v.join(", ") : (v || "");
    if (q.sub && A[q.sub.id]) v += (v ? "\n" : "") + A[q.sub.id];
    return v;
  }
  function summary() {
    return Q.map(function (q, k) {
      if (q.type === "intro" || q.type === "review") return "";
      var v = val(q); if (!v) return "";
      return "<div><dt>" + esc(q.q) + '<button type="button" data-edit="' + k + '">Edit</button></dt><dd>' + esc(v) + "</dd></div>";
    }).join("");
  }
  function submit() {
    var err = document.getElementById("err"), btn = document.getElementById("send");
    if (!document.getElementById("consent").checked) { err.textContent = "Tick the box so we can email you your demo."; return; }
    btn.disabled = true; btn.textContent = "Sending…";
    var payload = { answers: A, files: { logo: (uploads.logo || []).filter(function (u) { return u.url; }).map(function (u) { return { name: u.name, url: u.url }; }),
                                        photos: (uploads.photos || []).filter(function (u) { return u.url; }).map(function (u) { return { name: u.name, url: u.url }; }) },
                    questions: Q.filter(function (q) { return q.q; }).map(function (q) { return { id: q.id, q: q.q, a: val(q) }; }),
                    hp: document.getElementById("hp").value, elapsed_ms: Date.now() - started, consent_email: true,
                    page: location.pathname, ref: new URLSearchParams(location.search).get("ref") || "" };
    fetch(HOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json().catch(function () { return {}; }); })
      .then(function (j) {
        if (j && j.ok === false) throw new Error(j.error || "rejected");
        try { localStorage.removeItem(KEY); } catch (e) {}
        try { if (window.stationTrack) window.stationTrack("custom_website_submit"); } catch (e) {}
        bar.style.width = "100%"; count.textContent = "Done";
        stage.innerHTML = '<div class="slide done"><div class="tick" aria-hidden="true">✓</div><p class="k">Got it</p><h1>Thanks' + (A.name ? ", " + esc(String(A.name).split(" ")[0]) : "") + '.</h1>' +
          '<p class="help" style="margin:0 auto 22px">We\'re building your demo for ' + esc(A.business || "your business") + ' by hand. <b>Your demo will be in your inbox within 2–3 business days</b>, sent to ' + esc(A.email) + '.</p>' +
          '<p class="help" style="margin:0 auto">Questions before then? Reply to the confirmation email, or <a href="/call">book a time with us</a>.</p></div>';
      })
      .catch(function () { btn.disabled = false; btn.textContent = "Send it to Station"; err.textContent = "Something went wrong sending that. Please try again, or email main@station.solutions."; });
  }

  render();
})();
</script>
<script src="/analytics.js" defer></script>
</body></html>
