<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top up your plan — Station</title><meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5F4F1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#F5F4F1;--card:#fff;--bg-3:#F1EFE9;--line:#E7E4DE;--line-2:#DDD9D0;--ink:#1D1D1F;--muted:#5F5F64;--faint:#6E6E73;--accent:#8A5A00;--good:#167A44;--fd:'Inter','Segoe UI',system-ui,sans-serif;--fm:'JetBrains Mono',Consolas,monospace}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--fd);-webkit-font-smoothing:antialiased}
.top{border-bottom:1px solid var(--line);background:rgba(245,244,241,.92)} .top-in{max-width:760px;margin:0 auto;padding:0 22px;height:58px;display:flex;align-items:center}
.home{display:flex;align-items:center;gap:9px;font:700 12px var(--fd);letter-spacing:.13em;text-decoration:none;color:var(--ink)} .home svg{width:19px;height:19px}
.wrap{max-width:760px;margin:0 auto;padding:48px 22px 60px}
.k{font:600 11px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
h1{font-size:clamp(1.8rem,4.2vw,2.5rem);line-height:1.12;letter-spacing:-.025em;margin:0 0 12px}
.lede{color:var(--muted);margin:0 0 28px;max-width:58ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.card.main{border:2px solid var(--ink)}
.card .n{font-size:2.1rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.card .u{color:var(--muted);font-size:15px;margin:4px 0 16px}
.card .p{font-size:1.25rem;font-weight:700} .card .per{color:var(--faint);font-size:13.5px;margin:2px 0 18px}
.btn{display:inline-flex;justify-content:center;width:100%;font:600 16px var(--fd);background:var(--ink);color:#fff;border:0;border-radius:12px;padding:14px 18px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-2)}
.note{background:var(--bg-3);border-radius:14px;padding:16px 18px;color:var(--muted);font-size:15px;margin-top:24px}
.note b{color:var(--ink)} .fine{color:var(--faint);font-size:13px;margin-top:22px}
</style></head><body>
<header class="top"><div class="top-in"><a class="home" href="/" aria-label="Station home"><svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><g transform="rotate(45 50 50)"><rect x="29.5" y="3" width="18" height="36" rx="8.5"/><rect x="52.5" y="3" width="18" height="36" rx="8.5"/><rect x="29.5" y="61" width="18" height="36" rx="8.5"/><rect x="52.5" y="61" width="18" height="36" rx="8.5"/><rect x="3" y="29.5" width="36" height="18" rx="8.5"/><rect x="3" y="52.5" width="36" height="18" rx="8.5"/><rect x="61" y="29.5" width="36" height="18" rx="8.5"/><rect x="61" y="52.5" width="36" height="18" rx="8.5"/></g><circle cx="50" cy="50" r="16.5" fill="#F5F4F1"/></svg>STATION</a></div></header>
<main class="wrap" id="app"></main>
<script>
(function(){
  "use strict";
  // 2026-11-03 (exit/buy): top-up packs are sold inside the client Platform (Billing), against the account
  // that is signed in, so nothing here needs an account id or a payment link any more. The usage emails that
  // used to deep-link here (?t=<pack>&a=<account>) land on the same answer.
  var app = document.getElementById("app");
  app.innerHTML = '<p class="k">Top-ups</p><h1>Top-ups are bought inside your Station account.</h1>' +
    '<p class="lede">A top-up adds to this month\'s allowance straight away and is cheaper than usage over your plan. ' +
    'It is bought from Billing in your account, so the extra lands on the right plan.</p>' +
    '<p><a class="btn" href="https://my.station.solutions/#billing">Open Billing in your account</a></p>' +
    '<p class="fine">Questions? Reply to your usage email or <a href="/book/">book a time with us</a>. ' +
    'By purchasing you agree to the <a href="/legal/tos.html">Terms of Service</a>.</p>';
})();
</script>
</body></html>
