<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRAESIDE Golf Club — Public 18 Holes, Houston TX</title>
<meta name="description" content="A classic public parkland 18 under the oaks since 1962. Greens rolled true, four-hour pace actually enforced, walkers always welcome. Tee times seven days a week.">
<meta property="og:title" content="BRAESIDE Golf Club — Sixty-two years under the oaks">
<meta property="og:description" content="Great golf is conditions, not clubhouse chandeliers.">
<meta property="og:image" content="assets/photos/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/station.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%23F6F4EC'/><path d='M13 26 V6 L24 10.5 L13 15' fill='none' stroke='%231F5732' stroke-width='2.4' stroke-linejoin='round'/><path d='M13 6 L24 10.5 L13 15 Z' fill='%23E8B33C'/></svg>">
</head>
<body>

<header class="hdr" id="hdr">
  <a class="hdr-logo" href="#top" aria-label="BRAESIDE Golf Club — home">
    <svg class="logo-mark" viewBox="0 0 26 26" aria-hidden="true">
      <path d="M10 22 V4 L21 8.5 L10 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M10 4 L21 8.5 L10 13 Z" fill="currentColor" opacity=".55"/>
    </svg>
    <span class="logo-word">BRAESIDE</span>
    <span class="logo-sub">GOLF CLUB</span>
  </a>
  <nav class="hdr-nav" aria-label="Main navigation" id="nav"></nav>
  <button class="hdr-burger" id="burger" aria-label="Open menu" aria-expanded="false"><span></span><span></span></button>
</header>
<div class="mobile-menu" id="mobileMenu" aria-hidden="true"></div>

<main id="top">

  <!-- 1 · HERO -->
  <section class="hero" aria-label="BRAESIDE Golf Club">
    <div class="hero-plate" aria-hidden="true">
      <img id="heroImg" src="assets/photos/hero.jpg" alt="" width="2048" height="1152" fetchpriority="high">
    </div>
    <p class="mono hero-readout" id="heroReadout"></p>
    <h1 class="hero-line">
      <span class="hl-row"><span class="hl-inner">Sixty-two years</span></span>
      <span class="hl-row"><span class="hl-inner"><em>under the oaks.</em></span></span>
    </h1>
    <p class="hero-sub" id="heroSub"></p>
    <dl class="hero-spec" id="heroSpec"></dl>
    <div class="hero-cue mono" id="heroCue">
      <span id="cueText"></span>
      <svg viewBox="0 0 12 30" aria-hidden="true"><path d="M6 2 V24 M2 20 L6 26 L10 20" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </div>
  </section>

  <!-- 2 · THE CLOSING STRETCH (pinned signature) -->
  <section class="stage-wrap" id="stretch" aria-label="The closing stretch">
    <div class="stage" id="stretchStage">
      <div class="stage-head">
        <p class="mono stage-title" id="stageTitle"></p>
        <p class="mono stage-read" id="stageRead">HOLES 15–18 · PAR 16</p>
      </div>

      <div class="card-wrap">
        <div class="scorecard">
          <div class="scorecard-head">
            <span class="scorecard-title">BRAESIDE · BACK NINE</span>
            <span class="scorecard-out" id="cardCount">0 / 4 CARDED</span>
          </div>
          <div id="holeList"></div>
        </div>
        <figure class="card-photo" id="cardPhoto" aria-hidden="true">
          <div class="card-cap">
            <p class="card-cap-hole" id="capHole"></p>
            <p class="card-cap-note" id="capNote"></p>
          </div>
        </figure>
      </div>

      <div class="stage-beat" id="beatIntro"><p class="beat-intro-text" id="beatIntroText"></p></div>
      <div class="stage-beat" id="beatDone">
        <p class="mono beat-tag" id="doneTag"></p>
        <p class="beat-verdict" id="doneVerdict"></p>
      </div>
    </div>
  </section>

  <!-- 3 · MANIFESTO -->
  <section class="manifesto" id="manifesto" aria-labelledby="man-l0">
    <div class="man-lines">
      <h2 class="man-line" id="man-l0"><span></span></h2>
      <h2 class="man-line" id="man-l1"><span></span></h2>
    </div>
    <p class="man-support" id="manSupport"></p>
    <div class="man-stats" id="manStats"></div>
  </section>

  <!-- 4 · THE COURSE -->
  <section class="services" id="services" aria-labelledby="svcTitle">
    <div class="sec-head">
      <p class="mono sec-kicker">PLAY BRAESIDE</p>
      <h2 class="sec-title" id="svcTitle">Tee sheet to terrace.</h2>
    </div>
    <div class="svc-grid2" id="svcGrid"></div>
  </section>

  <!-- 5 · CONDITIONS -->
  <section class="steps" id="paperwork" aria-labelledby="stepsTitle">
    <div class="steps-inner">
      <figure class="steps-photo rv"><img id="stepsImg" alt="" loading="lazy"></figure>
      <div>
        <p class="mono sec-kicker">POSTED EVERY MONDAY</p>
        <h2 class="sec-title" id="stepsTitle"></h2>
        <p class="steps-sub" id="stepsSub"></p>
        <dl class="steps-list" id="stepsList"></dl>
      </div>
    </div>
  </section>

  <!-- 6 · THE CLUB -->
  <section class="crew" id="crew" aria-labelledby="crewTitle">
    <div class="sec-head">
      <p class="mono sec-kicker">THE CLUB</p>
      <h2 class="sec-title" id="crewTitle">Walt knows your swing.</h2>
    </div>
    <div class="crew-photos" id="crewPhotos"></div>
    <div class="crew-story">
      <figure class="crew-lead">
        <img id="leadPhoto" alt="" width="800" height="1067" loading="lazy">
        <figcaption id="leadCap"></figcaption>
      </figure>
      <div class="crew-story-body">
        <p id="crewStory"></p>
        <ul class="crew-certs" id="crewCerts"></ul>
      </div>
    </div>
  </section>

  <!-- 7 · REVIEWS -->
  <section class="reviews" id="reviews" aria-labelledby="revTitle">
    <div class="sec-head">
      <p class="mono sec-kicker">FROM THE TEE SHEET</p>
      <h2 class="sec-title" id="revTitle">The terrace rail agreed.</h2>
    </div>
    <div class="rev-grid" id="revGrid"></div>
  </section>

  <!-- 8 · BOOK -->
  <section class="book" id="book" aria-labelledby="bookTitle">
    <div class="book-inner">
      <p class="mono sec-kicker">TEE TIMES</p>
      <h2 class="book-title" id="bookTitle"></h2>
      <p class="book-sub" id="bookSub"></p>
      <div class="book-cta">
        <a class="btn-call" id="bookPhone" href="#"><span></span></a>
        <a class="btn-ghost" id="bookEmail" href="#"><span></span></a>
      </div>
      <ul class="mono book-badges" id="bookBadges"></ul>
      <div class="book-meta">
        <dl class="mono book-hours" id="bookHours"></dl>
        <address class="mono book-addr" id="bookAddr"></address>
      </div>
    </div>
  </section>

</main>

<footer class="ftr">
  <div class="ftr-row">
    <p class="ftr-line" id="ftrLine"></p>
    <div class="ftr-social" id="ftrSocial"></div>
  </div>
  <p class="mono ftr-fine" id="ftrFine"></p>
</footer>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/ScrollTrigger.min.js"></script>
<script src="js/vendor/lenis.min.js"></script>
<script src="js/site-core.js"></script>
<script src="content.js"></script>
<script src="js/premium.js"></script>
</body>
</html>
