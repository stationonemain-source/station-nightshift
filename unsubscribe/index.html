<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unsubscribe — Station</title><meta name="robots" content="noindex,nofollow"><meta name="description" content="Stop all email from Station."><meta name="theme-color" content="#F5F4F1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><link rel="icon" href="/favicon.ico"><style>

</style></head><body><header class="top"><div class="top-in"><a class="home" href="/" aria-label="Station home"><svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true"><g transform="rotate(45 50 50)"><rect x="29.5" y="3" width="18" height="36" rx="8.5"/><rect x="52.5" y="3" width="18" height="36" rx="8.5"/><rect x="29.5" y="61" width="18" height="36" rx="8.5"/><rect x="52.5" y="61" width="18" height="36" rx="8.5"/><rect x="3" y="29.5" width="36" height="18" rx="8.5"/><rect x="3" y="52.5" width="36" height="18" rx="8.5"/><rect x="61" y="29.5" width="36" height="18" rx="8.5"/><rect x="61" y="52.5" width="36" height="18" rx="8.5"/></g><circle cx="50" cy="50" r="16.5" fill="#F5F4F1"/></svg>STATION</a></div></header>
<main class="wrap" id="app"><p class="k">Email preferences</p><h1>Unsubscribing you&hellip;</h1><p class="lede">One moment.</p>
<noscript><div class="state warn"><p>This page needs JavaScript to record the unsubscribe. You can also just reply &ldquo;unsubscribe&rdquo; to the email and we&rsquo;ll stop.</p></div></noscript></main>
<script>(function(){
/* One click, no login (batch 4.4, 2026-09-27). The link carries a signed token (v1.<contact>.<signature>) and
   BOTH places that honour it are told, each of which checks the signature itself and only ever suppresses:
     1. audit.station.solutions/unsubscribe -- the cold engine's public host: its suppression list, and it
        confirms it recorded the request (the only answer this page can read);
     2. n8n "Station - Unsubscribe" -- sets GHL email DND + unsubscribed + do-not-contact on the contact.
   Neither returns anything about the person. The page claims "done" only when the engine confirmed it. */
var ENGINE="https://audit.station.solutions/unsubscribe", N8N="https://n8n.srv1748596.hstgr.cloud/webhook/station-unsub";
var app=document.getElementById("app"), u=new URLSearchParams(location.search).get("u")||"";
function show(k,h,p,cls){app.innerHTML='<p class="k">'+k+'</p><h1>'+h+'</h1><div class="state '+cls+'"><p style="margin:0">'+p+'</p></div>'+
  '<p class="fine">Station Automations Group LLC &middot; 1856 Branard St, Houston, TX 77098 &middot; <a href="mailto:main@station.solutions">main@station.solutions</a></p>';}
if(!/^v1\.[A-Za-z0-9]{2,40}\.[A-Za-z0-9_-]{20,64}$/.test(u)){
  show("Email preferences","This link is incomplete.","We couldn&rsquo;t read the unsubscribe code in this link. Reply &ldquo;unsubscribe&rdquo; to the email you got from us and we&rsquo;ll stop all email to you.","warn");return;}
var form="u="+encodeURIComponent(u);
var n8n=fetch(N8N,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:form}).then(function(){return true;},function(){return false;});
var eng=fetch(ENGINE,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:form}).then(function(r){return r.json();}).then(function(j){return !!(j&&j.recorded);},function(){return null;});
Promise.all([eng,n8n]).then(function(r){
  if(r[0]===true){show("Unsubscribed","You won&rsquo;t get any more email from us.","Done. Nothing more from Station goes to this address. If something already on its way arrives in the next few minutes, you can ignore it.","ok");}
  else if(r[1]){show("Request sent","Your unsubscribe request was sent.","We couldn&rsquo;t confirm it from this page. If anything else arrives from us, reply &ldquo;unsubscribe&rdquo; to it and we&rsquo;ll stop at once.","warn");}
  else{show("Email preferences","We couldn&rsquo;t reach our servers.","Please reply &ldquo;unsubscribe&rdquo; to the email you got from us and we&rsquo;ll stop all email to you.","warn");}
});
})();</script></body></html>
